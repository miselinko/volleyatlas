name: Web build
on:
  push:
    branches: [main]
    paths: ['frontend/**','.github/workflows/web.yml']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
